[project]
name = "realmate-ai"
version = "0.1.0"
description = "Sistema de mensageria com IA para imobiliária"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0,<6.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "celery>=5.4",
    "redis>=5.0",
    "pydantic-ai>=2.8.0",
    "djangorestframework>=3.18.0",
]

[dependency-groups]
dev = ["watchdog>=6.0.0"]
test = [
    "pytest>=8.3",
    "pytest-django>=4.9",
]
typecheck = [
    "mypy[faster-cache]==1.15.0",
    "types-requests==2.32.0.20250306",
    "celery-types==0.23.0",
    "django-types==0.20.0",
    "djangorestframework-types>=0.9.0",
]

[tool.mypy]
explicit_package_bases = true
packages = ["assistant", "common", "config", "conversations", "properties", "webhooks"]
namespace_packages = true
mypy_path = ["src"]
allow_redefinition = true
ignore_missing_imports = true
exclude = ["manage.py", "/migrations/*"]
plugins = []
enable_error_code = ["possibly-undefined"]

disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
show_error_codes = true
warn_unused_ignores = false

disallow_incomplete_defs = true
disallow_untyped_decorators = false
disallow_any_unimported = false

[tool.uv]
default-groups = ["dev", "test", "typecheck"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src"]
testpaths = ["src"]
python_files = ["test_*.py"]
addopts = "-q"
